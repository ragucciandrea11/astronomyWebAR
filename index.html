<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TEST DEFINITIVO</title>
</head>
<body style="background: #000; color: #0f0; font-family: monospace; padding: 20px;">

    <h1 style="color: white;">DEBUG CONSOLE</h1>
    <div id="logbox" style="border: 1px solid #0f0; height: 150px; overflow: auto; padding: 10px; margin-bottom: 20px;">
        In attesa di comando...
    </div>

    <button id="test-btn" style="width: 100%; padding: 30px; font-size: 20px; background: #0f0; border: none; font-weight: bold;">
        TESTA IL PULSANTE ORA
    </button>

    <script>
        const logbox = document.getElementById('logbox');
        function scrivi(messaggio) {
            logbox.innerHTML += "<br>> " + messaggio;
        }

        document.getElementById('test-btn').onclick = function() {
            scrivi("Pulsante premuto correttamente!");
            alert("IL PULSANTE FUNZIONA!");

            scrivi("Controllo Fotocamera...");
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ video: true })
                    .then(function(stream) {
                        scrivi("FOTOCAMERA: ACCESSO OK!");
                    })
                    .catch(function(err) {
                        scrivi("FOTOCAMERA: ERRORE -> " + err);
                    });
            } else {
                scrivi("FOTOCAMERA: Non supportata dal browser.");
            }
        };
    </script>
</body>
</html>
