<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Celestial AR - Allineamento Perfetto</title>
    
    <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background-color: black; }
        
        /* Schermata di Benvenuto */
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); color: white; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 20px; box-sizing: border-box;
        }

        #start-btn {
            padding: 20px 40px; font-size: 22px; background: #00ff88; color: black;
            border: none; border-radius: 50px; cursor: pointer; font-weight: bold; margin-top: 20px;
            box-shadow: 0 0 15px #00ff88;
        }

        /* Controlli di Calibrazione */
        #controls {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 85%; background: rgba(0,0,0,0.85); padding: 15px;
            border-radius: 15px; color: white; z-index: 10; text-align: center;
            border: 1px solid #00ff88;
        }

        input[type=range] { width: 100%; margin-top: 15px; cursor: pointer; accent-color: #00ff88; }
        
        /* Pannello Dati Tecnico */
        .data-panel { position: absolute; top: 10px; left: 10px; color: #00ff88; font-size: 11px; background: rgba(0,0,0,0.6); padding: 8px; border-radius: 5px; pointer-events: none; font-family: monospace; z-index: 10; }
        
        /* MIRINO CENTRALE DI PRECISIONE */
        #crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 40px; height: 40px; z-index: 20; pointer-events: none;
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background: #00ff88;
        }
        /* Linea orizzontale */
        #crosshair::before { top: 50%; left: -10px; right: -10px; height: 2px; transform: translateY(-50%); }
        /* Linea verticale */
        #crosshair::after { left: 50%; top: -10px; bottom: -10px; width: 2px; transform: translateX(-50%); }
        /* Cerchio centrale */
        .crosshair-circle {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border: 2px solid #00ff88; border-radius: 50%; box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div id="overlay">
        <h1>Celestial AR</h1>
        <p>1. Trova la Luna o il Sole reale.</p>
        <p>2. Mettili nel mirino al centro dello schermo.</p>
        <p>3. Usa la barra in basso per far combaciare la sfera virtuale.</p>
        <button id="start-btn">INIZIA OSSERVAZIONE</button>
    </div>

    <div class="data-panel" id="debug-info">Acquisizione GPS...</div>

    <div id="crosshair">
        <div class="crosshair-circle"></div>
    </div>

    <div id="controls">
        <label style="font-weight: bold; color: #00ff88;">Allineamento Fine della Bussola</label>
        <input type="range" id="azimuth-slider" min="0" max="360" value="0">
    </div>

    <a-scene vr-mode-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: false;" renderer="logarithmicDepthBuffer: true;">
        
        <a-camera id="main-camera" look-controls="magicWindowTrackingEnabled: true; touchEnabled: false;"></a-camera>

        <a-entity id="celestial-vault">
            
            <a-sphere id="sun" radius="3" color="#FFD700" material="emissive: #FFD700; emissiveIntensity: 2; opacity: 0.9"></a-sphere>
            <a-text value="SOLE" id="sun-label" align="center" scale="25 25 25" color="#FFD700"></a-text>

            <a-sphere id="moon" radius="2" color="#FFFFFF" material="emissive: #FFFFFF; emissiveIntensity: 1; opacity: 0.9"></a-sphere>
            <a-text value="LUNA" id="moon-label" align="center" scale="20 20 20" color="#FFFFFF"></a-text>

            <a-sphere id="mars" radius="0.8" color="#FF4500"></a-sphere>
            <a-text value="MARTE" id="mars-label" align="center" scale="15 15 15" color="#FF4500"></a-text>

            <a-entity id="stars-container"></a-entity>

        </a-entity>

    </a-scene>

    <script>
        const vault = document.getElementById('celestial-vault');
        const starsContainer = document.getElementById('stars-container');
        const slider = document.getElementById('azimuth-slider');
        const debug = document.getElementById('debug-info');

        function getVector(alt, az, dist) {
            const altRad = alt * (Math.PI / 180);
            const azRad = az * (Math.PI / 180);
            return {
                x: dist * Math.cos(altRad) * Math.sin(azRad),
                y: dist * Math.sin(altRad),
                z: dist * Math.cos(altRad) * -Math.cos(azRad)
            };
        }

        function updateAllPositions(lat, lon) {
            const date = new Date();
            const observer = new Astronomy.Observer(lat, lon, 0);
            
            debug.innerHTML = `GPS: ${lat.toFixed(2)}, ${lon.toFixed(2)}<br>Ora: ${date.toLocaleTimeString()}`;

            // Sistema Solare
            const bodies = ['Sun', 'Moon', 'Mars'];
            bodies.forEach(name => {
                const equ = Astronomy.Equator(name, date, observer, true, true);
                const hor = Astronomy.Horizon(date, observer
