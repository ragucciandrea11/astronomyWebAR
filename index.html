<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tool Calibrazione Bussola AR</title>
    <style>
        body {
            background-color: #111;
            color: #00ff88;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }

        h2 { color: #fff; margin-bottom: 5px; }

        .panel {
            background: #222;
            border: 1px solid #444;
            border-radius: 10px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            margin-top: 20px;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 18px;
        }

        .data-value { color: #fff; font-weight: bold; }

        button {
            background: #00ff88;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            max-width: 400px;
            margin-top: 10px;
        }

        /* La Bussola Visiva */
        #compass-container {
            width: 200px;
            height: 200px;
            border: 4px solid #444;
            border-radius: 50%;
            position: relative;
            margin: 30px auto;
            background: #000;
        }

        #compass-needle {
            width: 4px;
            height: 100px;
            background: red;
            position: absolute;
            top: 0;
            left: 50%;
            transform-origin: bottom center;
            transform: translateX(-50%) rotate(0deg);
            transition: transform 0.1s ease-out;
        }

        .compass-label { position: absolute; color: #666; font-weight: bold; }
        .label-n { top: 5px; left: 50%; transform: translateX(-50%); color: red; }
        .label-s { bottom: 5px; left: 50%; transform: translateX(-50%); }
        .label-e { right: 5px; top: 50%; transform: translateY(-50%); }
        .label-w { left: 5px; top: 50%; transform: translateY(-50%); }

        input[type=range] {
            width: 100%;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h2>Test Sensori & Calibrazione</h2>
    <p style="color: #aaa; font-size: 14px;">Diagnostica per AR Location-Based</p>

    <button id="btn-start">Attiva Sensori (Richiede Tap)</button>

    <div class="panel">
        <div class="data-row">
            <span>Bussola Grezza (Gradi):</span>
            <span id="raw-heading" class="data-value">0°</span>
        </div>
        <div class="data-row" style="color: #ffaa00;">
            <span>Offset Manuale:</span>
            <span id="offset-val" class="data-value">0°</span>
        </div>
        <div class="data-row" style="border-top: 1px solid #444; padding-top: 10px; color: #00ffff;">
            <span>Azimut Finale (AR):</span>
            <span id="final-heading" class="data-value">0°</span>
        </div>

        <label style="display: block; margin-top: 20px; color: #aaa;">Calibrazione Bussola (Slider)</label>
        <input type="range" id="offset-slider" min="-180" max="180" value="0">
    </div>

    <div id="compass-container">
        <div class="compass-label label-n">N</div>
        <div class="compass-label label-e">E</div>
        <div class="compass-label label-s">S</div>
        <div class="compass-label label-w">O</div>
        <div id="compass-needle"></div>
    </div>

    <script>
        const btnStart = document.getElementById('btn-start');
        const rawHeadingEl = document.getElementById('raw-heading');
        const finalHeadingEl = document.getElementById('final-heading');
        const offsetValEl = document.getElementById('offset-val');
        const slider = document.getElementById('offset-slider');
        const needle = document.getElementById('compass-needle');

        let rawHeading = 0;
        let offset = 0;

        // Gestione dell'Offset manuale
        slider.addEventListener('input', (e) => {
            offset = parseInt(e.target.value);
            offsetValEl.textContent = offset > 0 ? `+${offset}°` : `${offset}°`;
            updateDisplay();
        });

        // Aggiorna lo schermo e ruota la bussola
        function updateDisplay() {
            let finalHeading = (rawHeading + offset) % 360;
            if (finalHeading < 0) finalHeading += 360; // Evita numeri negativi

            rawHeadingEl.textContent = Math.round(rawHeading) + "°";
            finalHeadingEl.textContent = Math.round(finalHeading) + "°";

            // Ruotiamo l'ago della bussola (direzione opposta al movimento)
            needle.style.transform = `translateX(-50%) rotate(${finalHeading}deg)`;
        }

        // Il cuore del sistema: estrarre il Nord magnetico
        function handleOrientation(event) {
            // 1. Logica per iOS (Usa webkitCompassHeading)
            if (event.webkitCompassHeading !== undefined) {
                rawHeading = event.webkitCompassHeading;
            } 
            // 2. Logica per Android (Usa alpha dalla lettura assoluta)
            else if (event.alpha !== null) {
                // I browser standard basano alpha su Ovest/Est in modo anti-orario. 
                // 360 - alpha lo converte nella lettura standard della bussola in senso orario.
                rawHeading = 360 - event.alpha;
            }

            updateDisplay();
        }

        // Richiesta permessi e attivazione
        btnStart.addEventListener('click', async () => {
            // Controlla se siamo su un dispositivo iOS che richiede il permesso esplicito
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permissionState = await DeviceOrientationEvent.requestPermission();
                    if (permissionState === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation);
                        btnStart.style.background = "#444";
                        btnStart.textContent = "Sensori Attivi";
                    } else {
                        alert("Permesso negato. Impossibile usare la bussola.");
                    }
                } catch (error) {
                    alert("Errore nell'attivazione dei sensori.");
                }
            } else {
                // Per Android o browser che non richiedono permesso esplicito
                // Proviamo prima l'evento 'deviceorientationabsolute' (Android)
                if ('ondeviceorientationabsolute' in window) {
                    window.addEventListener('deviceorientationabsolute', handleOrientation);
                } else {
                    window.addEventListener('deviceorientation', handleOrientation);
                }
                btnStart.style.background = "#444";
                btnStart.textContent = "Sensori Attivi";
            }
        });
    </script>
</body>
</html>
