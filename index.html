<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Celestial AR - Force Start</title>
    <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; color: white; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        #btn { padding: 20px; font-size: 20px; background: #00ff88; border: none; border-radius: 10px; cursor: pointer; }
        #controls { position: absolute; bottom: 20px; width: 100%; text-align: center; z-index: 100; display:none; }
        .info { position: absolute; top: 10px; color: #00ff88; z-index: 100; background: rgba(0,0,0,0.5); padding: 5px; font-size: 10px; }
    </style>
</head>
<body>
    <div id="overlay">
        <h1>Celestial AR</h1>
        <button id="btn">FORZA AVVIO (Anche al chiuso)</button>
    </div>
    <div class="info" id="status">In attesa...</div>
    <div id="controls">
        <input type="range" id="slider" min="0" max="360" style="width: 80%">
        <p style="color: white">Trascina per allineare le stelle</p>
    </div>
    <a-scene vr-mode-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-camera id="cam" look-controls="touchEnabled: false;"></a-camera>
        <a-entity id="vault">
            <a-sphere id="moon" radius="2" color="#EEE"></a-sphere>
            <a-text id="moon-txt" value="LUNA" align="center" scale="15 15 15"></a-text>
            <a-entity id="stars"></a-entity>
        </a-entity>
    </a-scene>
    <script>
        const btn = document.getElementById('btn');
        const vault = document.getElementById('vault');
        const status = document.getElementById('status');

        function draw(lat, lon) {
            const date = new Date();
            const obs = new Astronomy.Observer(lat, lon, 0);
            const equ = Astronomy.Equator('Moon', date, obs, true, true);
            const hor = Astronomy.Horizon(date, obs, equ.ra, equ.dec, 'normal');
            const altRad = hor.altitude * (Math.PI/180);
            const azRad = hor.azimuth * (Math.PI/180);
            const d = 400;
            const pos = { x: d * Math.cos(altRad) * Math.sin(azRad), y: d * Math.sin(altRad), z: d * Math.cos(altRad) * -Math.cos(azRad) };
            document.getElementById('moon').setAttribute('position', `${pos.x} ${pos.y} ${pos.z}`);
            document.getElementById('moon-txt').setAttribute('position', `${pos.x} ${pos.y+10} ${pos.z}`);
            status.innerHTML = `Posizione caricata (${lat.toFixed(1)}, ${lon.toFixed(1)})`;
        }

        btn.onclick = async () => {
            // 1. Chiudi subito l'overlay
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('controls').style.display = 'block';

            // 2. Chiedi sensori (obbligatorio per movimento)
            if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') {
                await DeviceOrientationEvent.requestPermission();
            }

            // 3. Carica il cielo con posizione di default (Roma) mentre cerca il GPS vero
            draw(41.9, 12.5); 

            navigator.geolocation.getCurrentPosition(
                (p) => draw(p.coords.latitude, p.coords.longitude),
                (e) => console.log("Uso default"),
                { timeout: 2000 }
            );
        };

        document.getElementById('slider').oninput = (e) => {
            vault.setAttribute('rotation', `0 ${e.target.value} 0`);
        };
    </script>
</body>
</html>
