<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Celestial AR v2.0</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: monospace; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; color: #0f0; z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        #btn-start { padding: 25px 50px; font-size: 20px; background: #0f0; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; box-shadow: 0 0 20px #0f0; }
        #console { position: absolute; top: 10px; left: 10px; color: #0f0; font-size: 10px; z-index: 10001; pointer-events: none; background: rgba(0,0,0,0.5); }
        #controls { position: absolute; bottom: 20px; width: 100%; z-index: 10001; text-align: center; display: none; }
        input[type=range] { width: 80%; height: 30px; }
    </style>
</head>
<body>

    <div id="console">In attesa di avvio...</div>

    <div id="overlay">
        <h1>CELESTIAL AR</h1>
        <p>Sistema di puntamento NASA-ready</p>
        <button id="btn-start">ATTIVA VISORE</button>
    </div>

    <div id="controls">
        <input type="range" id="slider" min="0" max="360" value="0">
        <p style="color: white; margin: 5px;">Trascina per allineare i nomi alle stelle</p>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false" loading-screen="enabled: false">
        <a-camera id="cam" look-controls="touchEnabled: false;"></a-camera>
        <a-entity id="vault">
            <a-entity id="stars-group"></a-entity>
            <a-sphere id="moon-obj" radius="1.5" color="#fff" material="emissive:#fff; emissiveIntensity:0.5"></a-sphere>
            <a-text id="moon-label" value="LUNA" align="center" scale="12 12 12"></a-text>
        </a-entity>
    </a-scene>

    <script>
        const log = (msg) => { document.getElementById('console').innerHTML += "<br>> " + msg; console.log(msg); };
        const btn = document.getElementById('btn-start');
        const vault = document.getElementById('vault');

        btn.onclick = async () => {
            log("Inizializzazione...");
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('controls').style.display = 'block';

            // 1. Chiedo sensori
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const res = await DeviceOrientationEvent.requestPermission();
                    log("Sensori: " + res);
                } catch(e) { log("Errore sensori: " + e); }
            }

            // 2. Astronomia
            try {
                const lat = 41.89, lon = 12.49; // Default Roma
                const date = new Date();
                const obs = new Astronomy.Observer(lat, lon, 0);
                
                // Luna
                const equ = Astronomy.Equator('Moon', date, obs, true, true);
                const hor = Astronomy.Horizon(date, obs, equ.ra, equ.dec, 'normal');
                const altRad = hor.altitude * (Math.PI/180);
                const azRad = hor.azimuth * (Math.PI/180);
                const d = 300;
                const x = d * Math.cos(altRad) * Math.sin(azRad);
                const y = d * Math.sin(altRad);
                const z = d * Math.cos(altRad) * -Math.cos(azRad);
                
                document.getElementById('moon-obj').setAttribute('position', `${x} ${y} ${z}`);
                document.getElementById('moon-label').setAttribute('position', `${x} ${y+10} ${z}`);
                log("Astronomia caricata.");
                
                // GPS Reale
                navigator.geolocation.getCurrentPosition((p) => {
                    log("GPS reale agganciato.");
                    // Qui si potrebbe ricalcolare con la posizione esatta
                });

            } catch(e) { log("Errore logica: " + e); }
        };

        document.getElementById('slider').oninput = (e) => {
            vault.setAttribute('rotation', `0 ${e.target.value} 0`);
        };
    </script>
</body>
</html>
