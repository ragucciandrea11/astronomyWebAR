<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebAR Celestial Simulator - Pro</title>
    
    <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: 'Courier New', Courier, monospace; }
        
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); color: #00ff88; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 20px; box-sizing: border-box;
        }

        #start-btn {
            padding: 20px 40px; font-size: 20px; background: #00ff88; color: black;
            border: none; border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 30px;
        }

        /* Il nuovo cruscotto HUD (Head-Up Display) */
        #hud {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; background: rgba(0, 0, 0, 0.8); border: 1px solid #00ff88;
            border-radius: 10px; color: white; z-index: 1000; padding: 15px; box-sizing: border-box;
        }

        .hud-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
        .hud-value { font-weight: bold; color: #00ff88; }
        input[type=range] { width: 100%; margin-top: 10px; accent-color: #00ff88; }

        #top-info {
            position: absolute; top: 10px; left: 10px; color: white; background: rgba(0,0,0,0.5);
            padding: 5px 10px; border-radius: 5px; font-size: 12px; z-index: 1000;
        }
    </style>
</head>
<body>

    <div id="overlay">
        <h2>ALLINEAMENTO NASA</h2>
        <p>Per sincronizzare la volta celeste, dobbiamo sbloccare i sensori hardware del tuo dispositivo.</p>
        <button id="start-btn">SBLOCCA SENSORI E INIZIA</button>
    </div>

    <div id="top-info">GPS In attesa...</div>

    <div id="hud" style="display: none;">
        <div class="hud-row">
            <span>Bussola Telefono:</span>
            <span id="raw-heading" class="hud-value">--°</span>
        </div>
        <div class="hud-row">
            <span>Offset Manuale:</span>
            <span id="offset-val" class="hud-value" style="color: #ffcc00;">0°</span>
        </div>
        <input type="range" id="azimuth-slider" min="-180" max="180" value="0">
    </div>

    <a-scene vr-mode-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: false;" renderer="logarithmicDepthBuffer: true;">
        <a-camera id="main-camera" position="0 1.6 0" look-controls="magicWindowTrackingEnabled: true; touchEnabled: false;"></a-camera>

        <a-entity id="celestial-vault">
            <a-sphere id="sun" radius="10" color="#FFD700"></a-sphere>
            <a-text value="SOLE" id="sun-label" align="center" scale="30 30 30" color="#FFD700" position="0 15 0"></a-text>

            <a-sphere id="moon" radius="8" color="#FFFFFF"></a-sphere>
            <a-text value="LUNA" id="moon-label" align="center" scale="25 25 25" color="#FFFFFF" position="0 15 0"></a-text>

            <a-sphere id="mars" radius="4" color="#FF4500"></a-sphere>
            <a-text value="MARTE" id="mars-label" align="center" scale="20 20 20" color="#FF4500" position="0 15 0"></a-text>
        </a-entity>
    </a-scene>

    <script>
        const vault = document.getElementById('celestial-vault');
        const slider = document.getElementById('azimuth-slider');
        const topInfo = document.getElementById('top-info');
        const rawHeadingEl = document.getElementById('raw-heading');
        const offsetValEl = document.getElementById('offset-val');

        let currentOffset = 0;

        // Geometria Sferica -> Cartesiana
        function getVector(alt, az, dist = 600) {
            const altRad = alt * (Math.PI / 180);
            const azRad = az * (Math.PI / 180);
            return {
                x: dist * Math.cos(altRad) * Math.sin(azRad),
                y: dist * Math.sin(altRad),
                z: dist * Math.cos(altRad) * -Math.cos(azRad)
            };
        }

        // Calcolo e Posizionamento Corpi Celesti
        function updatePositions(lat, lon) {
            const date = new Date();
            const observer = new Astronomy.Observer(lat, lon, 0);
            
            const bodies = ['Sun', 'Moon', 'Mars'];
            bodies.forEach(name => {
                const equ = Astronomy.Equator(name, date, observer, true, true);
                const hor = Astronomy.Horizon(date, observer, equ.ra, equ.dec, 'normal');
                const pos = getVector(hor.altitude, hor.azimuth);
                
                const el = document.getElementById(name.toLowerCase());
                const label = document.getElementById(name.toLowerCase() + '-label');
                
                if(el) el.setAttribute('position', `${pos.x} ${pos.y} ${pos.z}`);
                // Mettiamo l'etichetta esattamente sopra il pianeta
                if(label) label.setAttribute('position', `${pos.x} ${pos.y + 20} ${pos.z}`);
            });

            topInfo.innerHTML = `Lat: ${lat.toFixed(2)} Lon: ${lon.toFixed(2)}<br>Ora: ${date.toLocaleTimeString()}`;
        }

        // Lettura della Bussola in Tempo Reale
        function handleOrientation(event) {
            let heading = 0;
            if (event.webkitCompassHeading !== undefined) {
                heading = event.webkitCompassHeading; // iOS
            } else if (event.alpha !== null) {
                heading = 360 - event.alpha; // Android
            }
            rawHeadingEl.textContent = Math.round(heading) + "°";
        }

        // Gestione Avvio e Permessi
        document.getElementById('start-btn').addEventListener('click', async () => {
            
            // Sblocco sensori iOS
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation);
                    }
                } catch (e) { alert("Errore sensori."); }
            } else {
                // Sblocco sensori Android
                if ('ondeviceorientationabsolute' in window) {
                    window.addEventListener('deviceorientationabsolute', handleOrientation);
                } else {
                    window.addEventListener('deviceorientation', handleOrientation);
                }
            }

            // GPS
            navigator.geolocation.getCurrentPosition((pos) => {
                updatePositions(pos.coords.latitude, pos.coords.longitude);
                
                // Nascondi overlay e mostra HUD
                document.getElementById('overlay').style.display = 'none';
                document.getElementById('hud').style.display = 'block';
            }, (err) => {
                alert("Devi attivare il GPS per calcolare le stelle.");
            });
        });

        // Gestione Slider Offset
        slider.addEventListener('input', (e) => {
            currentOffset = parseInt(e.target.value);
            offsetValEl.textContent = currentOffset > 0 ? `+${currentOffset}°` : `${currentOffset}°`;
            // Ruota l'intera volta celeste per farla combaciare con la realtà
            vault.setAttribute('rotation', `0 ${currentOffset} 0`);
        });

    </script>
</body>
</html>
