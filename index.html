<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>DEBUG CELESTIAL</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
    <style>
        #splash { position: fixed; top:0; left:0; width:100%; height:100%; background:black; color:white; z-index:99999; display:flex; flex-direction:column; align-items:center; justify-content:center; }
        button { padding:20px; font-size:20px; background:#0f0; border:none; border-radius:10px; }
    </style>
</head>
<body style="margin: 0px; overflow: hidden;">

    <div id="splash">
        <h1>RESET TOTALE</h1>
        <button onclick="start()">CLICCA QUI</button>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">
        
        <a-sphere position="0 0 -10" radius="2" color="red"></a-sphere>
        
        <a-camera id="cam" look-controls></a-camera>
        
        <a-entity id="mondo">
            <a-sphere id="luna" radius="1" color="white" position="0 10 -20"></a-sphere>
            <a-text value="LUNA" position="0 12 -20" align="center" scale="10 10 10"></a-text>
        </a-entity>
    </a-scene>

    <script>
        function start() {
            alert("1. Avvio sensori...");
            
            // Nascondi overlay
            document.getElementById('splash').style.display = 'none';

            // Permessi iOS/Android
            if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(response => {
                    alert("2. Permesso orientamento: " + response);
                }).catch(err => alert("Errore sensori: " + err));
            }

            // Test Astronomico Veloce (Default Roma)
            try {
                const date = new Date();
                const obs = new Astronomy.Observer(41.9, 12.5, 0);
                const equ = Astronomy.Equator('Moon', date, obs, true, true);
                const hor = Astronomy.Horizon(date, obs, equ.ra, equ.dec, 'normal');
                alert("3. Astronomia OK! Luna Altezza: " + hor.altitude.toFixed(1));
            } catch(e) {
                alert("Errore Astronomia: " + e);
            }
        }
    </script>
</body>
</html>
